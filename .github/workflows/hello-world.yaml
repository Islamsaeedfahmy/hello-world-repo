name: Hello World

on: push
env:
    Name: Hallo Welt!

jobs:
    hello-job:
        runs-on: ubuntu-latest
        steps:
            - name: Echo text
              run: echo "Hello, world!"
            - name: echo name
              run: echo " Mein name ist Islam"
            
   
    notify-teams:
        runs-on: ubuntu-latest
        steps:
          - name: Send notification to Teams
            env:
              TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

            run: |
              curl -X POST "$TEAMS_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d '{"text":"Hello Teams! GitHub Actions is working successfully."}'
